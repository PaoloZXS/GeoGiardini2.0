name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Permette di eseguire manualmente da GitHub

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout codice
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Installa dipendenze npm
        run: npm ci

      - name: 🏗️ Build Vite (frontend)
        run: npm run build

      - name: 🔄 Sincronizza Capacitor
        run: npx cap sync

      - name: 📱 Build APK Android
        run: |
          cd android
          # Se google-services.json non esiste, il build funziona lo stesso
          # (solo senza notifiche FCM, che vanno configurate dopo)
          ./gradlew assembleDebug

      - name: 📤 Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoGiardini-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 15
          if-no-files-found: error

      - name: ℹ️ Riepilogo
        run: |
          echo "✅ APK buildato con successo!"
          echo "Scarica l'APK da: Actions → Build APK Android → Artifacts"
          ls -lh android/app/build/outputs/apk/debug/
