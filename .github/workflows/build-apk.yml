name: Build APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Android SDK 35
        run: |
          yes | sdkmanager "platforms;android-35" 2>&1 || true
          yes | sdkmanager "build-tools;35.0.0" 2>&1 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installa dipendenze npm
        run: npm ci

      - name: Build Vite (frontend)
        run: npm run build

      - name: Sincronizza Capacitor
        run: npx cap sync

      - name: Diagnostica
        run: |
          chmod +x android/gradlew
          echo "=== Android SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>&1 || echo "Nessuna piattaforma"
          echo "=== Gradle version ==="
          android/gradlew --version

      - name: Build APK Android
        run: |
          cd android
          ./gradlew assembleDebug 2>&1

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoGiardini-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 15
          if-no-files-found: error

      - name: Riepilogo
        run: |
          echo "APK build completato!"
          ls -lh android/app/build/outputs/apk/debug/
